databases:
  - name: project-innovatefund-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: project-innovatefund-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: project-innovatefund-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: project-innovatefund-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: project-innovatefund-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: project-innovatefund-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: project-innovatefund-db
          property: password
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENABLED
        value: "true"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: gemini
